; FUSION26 - OLED Dashboard Node (optional PlatformIO build).
; Arduino IDE is the primary toolchain; this file is for convenience.
;
;   pio run                 ; build
;   pio run -t upload       ; flash
;   pio device monitor      ; serial @ 115200
;
; The dashboard uses the same ESPNOW_CHANNEL / PROTOCOL_VERSION as the fleet.
; Override at build time if needed by adding to build_flags, e.g.:
;   build_flags = -DESPNOW_CHANNEL=6
;
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/Adafruit GFX Library@^1.12.6
build_flags =
    -Wall
