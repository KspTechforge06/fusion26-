; FUSION26 - optional PlatformIO build.
; Primary path is the Arduino IDE (folder name must match esp8266.ino).
;
; If you use PlatformIO, place this file in the esp8266/ folder and run:
;     pio run -e amr1
;     pio run -e amr1 -t upload
; Duplicate lines with a different -DROBOT_ID per board.

[platformio]
src_dir = .

[env:amr1]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_flags = -DROBOT_ID=1

; [env:amr2]
; platform = espressif8266
; board = nodemcuv2
; framework = arduino
; monitor_speed = 115200
; build_flags = -DROBOT_ID=2
